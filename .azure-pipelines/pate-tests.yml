name: pate-e2e-$(Rev:rrr)

# ─────────────────────────────────────────────────────────────────────────────
# Power Platform — TC1_PJC_001 Pipeline
#
#   Job 1 — pac test run --provider Powerfx   (ubuntu-latest, bash)
#            Fast Power Fx expression validation; no browser required.
#
#   Job 2 — npx playwright test --project=pjc  (ubuntu-latest, bash)
#            Full browser test using packages/e2e-tests/tests/pjc/TC1_PJC_001.test.ts.
#            Storage state is downloaded from ADO Secure Files and passed via
#            PATE_USER1_STORAGE_STATE so playwright.config.ts picks it up.
#
# PREREQUISITES:
#   • ADO Secure Files: pate-user1-storagestate.json
#       (generated locally with generate-pate-storagestate.js)
#   • Pipeline secret variable: user1Password
# ─────────────────────────────────────────────────────────────────────────────

trigger: none
pr: none

schedules:
  - cron: "0 6 * * 1-5"
    displayName: Daily PATE tests (weekdays 06:00 UTC)
    branches:
      include:
        - main
    always: true

variables:
  - name: POWER_APPS_ENVIRONMENT_URL
    value: "https://devhugoplaygroundpoc.crm4.dynamics.com/"   # CHANGE THIS
  - name: POWER_APPS_ENVIRONMENT_ID
    value: "493ec420-26dc-ebc2-9bc0-11821149f051"              # CHANGE THIS
  - name: AZURE_TENANT_ID
    value: "47f44079-0021-4177-80c9-68531941e357"              # CHANGE THIS
  - name: user1Email
    value: "channa.meng.extern@semperitgroup.com"              # CHANGE THIS
  # user1Password — add as a SECRET pipeline variable in ADO
  - name: testPlanFile
    value: "tests/TC1_PJC_001.fx.yaml"

stages:
  - stage: PATETests
    displayName: "TC1_PJC_001 — Power Fx + Canvas (parallel)"
    jobs:

      # ══════════════════════════════════════════════════════════════════════════
      # Job 1 — pac test run --provider Powerfx (ubuntu-latest)
      # Runs the fx.yaml test plan through the Power Fx test engine provider
      # (no browser required — evaluates Power Fx expressions directly).
      # ══════════════════════════════════════════════════════════════════════════
      - job: PowerFxRun
        displayName: "pac test run --provider Powerfx"
        timeoutInMinutes: 30
        pool:
          name: "Azure Pipelines"
          vmImage: "ubuntu-latest"

        steps:
          - checkout: self

          # Download Microsoft.PowerApps.CLI.Tool from NuGet (tool entry point package)
          - bash: |
              PAC_DIR="$AGENT_TOOLSDIRECTORY/pac"
              mkdir -p "$PAC_DIR/bin"
              VERSION="2.6.3"
              echo "Downloading Microsoft.PowerApps.CLI.Tool v$VERSION"
              curl -fsSL "https://api.nuget.org/v3-flatcontainer/microsoft.powerapps.cli.tool/$VERSION/microsoft.powerapps.cli.tool.$VERSION.nupkg" \
                -o "$PAC_DIR/pac-tool.zip"
              unzip -q "$PAC_DIR/pac-tool.zip" -d "$PAC_DIR/pkg"

              # No Linux shim exists in the package — find pac.dll and wrap with dotnet
              PAC_DLL=$(find "$PAC_DIR/pkg" -name "pac.dll" -type f 2>/dev/null | head -1)
              if [ -n "$PAC_DLL" ]; then
                printf '#!/bin/bash\nexec dotnet "%s" "$@"\n' "$PAC_DLL" > "$PAC_DIR/bin/pac"
                chmod +x "$PAC_DIR/bin/pac"
                echo "##vso[task.prependpath]$PAC_DIR/bin"
                "$PAC_DIR/bin/pac" help
              else
                echo "##[error]pac.dll not found. Root DLLs in package:"
                find "$PAC_DIR/pkg" -name "*.dll" -not -path "*/*-*/*" -not -path "*/shims/*" | sort
                exit 1
              fi
            displayName: "Install pac CLI from NuGet"

          - bash: |
              pac auth create \
                --environment "$(POWER_APPS_ENVIRONMENT_URL)" \
                --username "$(user1Email)" \
                --password "$(user1Password)"
            displayName: "pac auth create"
            env:
              user1Password: $(user1Password)

          - bash: |
              pac test run \
                --test-plan-file "$(testPlanFile)" \
                --environment-id "$(POWER_APPS_ENVIRONMENT_ID)" \
                --tenant "$(AZURE_TENANT_ID)" \
                --provider Powerfx \
                --user-auth Dataverse \
                --log-level Information
            displayName: "pac test run --provider Powerfx — TC1_PJC_001.fx.yaml"
            workingDirectory: $(Build.SourcesDirectory)
            env:
              user1Email: $(user1Email)
              user1Password: $(user1Password)

      # ══════════════════════════════════════════════════════════════════════════
      # Job 2 — npx playwright test --project=pjc (ubuntu-latest)
      # Runs packages/e2e-tests/tests/pjc/TC1_PJC_001.test.ts via the standard
      # Playwright toolkit pipeline. Storage state is pulled from ADO Secure
      # Files and injected as PATE_USER1_STORAGE_STATE.
      # ══════════════════════════════════════════════════════════════════════════
      - job: CanvasTestRun
        displayName: "npx playwright test --project=pjc"
        timeoutInMinutes: 60
        pool:
          name: "Azure Pipelines"
          vmImage: "ubuntu-latest"

        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: "Use Node.js 20.x"
            inputs:
              versionSpec: "20.x"

          - bash: |
              corepack enable
              corepack prepare pnpm@10.28.1 --activate
            displayName: "Enable corepack + pnpm"

          - bash: npm install -g @microsoft/rush
            displayName: "Install Rush"

          - bash: node common/scripts/install-run-rush.js install --bypass-policy
            displayName: "Rush install"

          - bash: node common/scripts/install-run-rush.js build --to power-platform-playwright-toolkit
            displayName: "Rush build (toolkit)"

          - bash: npx playwright install chromium --with-deps
            displayName: "Install Playwright Chromium"
            workingDirectory: $(Build.SourcesDirectory)/packages/e2e-tests
            failOnStderr: false
            timeoutInMinutes: 15

          - task: DownloadSecureFile@1
            name: storageState
            displayName: "Download storage state (Secure Files)"
            inputs:
              secureFile: "pate-user1-storagestate.json"

          - bash: npx playwright test --project=pjc
            displayName: "Run TC1_PJC_001 Playwright test"
            workingDirectory: $(Build.SourcesDirectory)/packages/e2e-tests
            env:
              CI: "true"
              PATE_USER1_STORAGE_STATE: $(storageState.secureFilePath)
              OUTPUT_DIRECTORY: $(Build.ArtifactStagingDirectory)

          - task: PublishTestResults@2
            displayName: "Publish test results (JUnit)"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "junit-results.xml"
              searchFolder: "$(Build.ArtifactStagingDirectory)"
              testRunTitle: "PJC — TC1_PJC_001"
              failTaskOnFailedTests: true
              mergeTestResults: true

          - task: PublishPipelineArtifact@1
            displayName: "Publish test artifacts (video / screenshots)"
            condition: succeededOrFailed()
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/artifacts"
              artifact: PJC-Artifacts-TC1_PJC_001
