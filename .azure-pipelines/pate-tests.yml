name: pate-e2e-$(Rev:rrr)

# ─────────────────────────────────────────────────────────────────────────────
# Power Platform — TC1_PJC_001 Pipeline
# Runs two parallel jobs against the same test file:
#
#   Job 1 — pac power-fx run   (ubuntu-latest, bash)
#   Job 2 — pac test run       (windows-latest, pwsh)
#
# pac CLI is installed by downloading Microsoft.PowerApps.CLI from NuGet.
#
# Test file : tests/TC1_PJC_001.fx.yaml
# App       : capop_opexcapexapprovalappv34_ddc56
# Persona   : User1  (env vars: user1Email / user1Password)
#
# BEFORE USE:
#   1. Replace every "# CHANGE THIS" value below with your own.
#   2. Add pipeline secret variables in ADO:
#        user1Password = <test account password>
# ─────────────────────────────────────────────────────────────────────────────

trigger: none
pr: none

schedules:
  - cron: "0 6 * * 1-5"
    displayName: Daily PATE tests (weekdays 06:00 UTC)
    branches:
      include:
        - main
    always: true

variables:
  - name: POWER_APPS_ENVIRONMENT_URL
    value: "https://devhugoplaygroundpoc.crm4.dynamics.com/"   # CHANGE THIS
  - name: POWER_APPS_ENVIRONMENT_ID
    value: "493ec420-26dc-ebc2-9bc0-11821149f051"              # CHANGE THIS
  - name: AZURE_TENANT_ID
    value: "47f44079-0021-4177-80c9-68531941e357"              # CHANGE THIS
  - name: user1Email
    value: "channa.meng.extern@semperitgroup.com"              # CHANGE THIS
  # user1Password — add as a SECRET pipeline variable in ADO
  - name: testPlanFile
    value: "tests/TC1_PJC_001.fx.yaml"

stages:
  - stage: PATETests
    displayName: "TC1_PJC_001 — Power Fx + Canvas (parallel)"
    jobs:

      # ══════════════════════════════════════════════════════════════════════════
      # Job 1 — pac power-fx run (ubuntu-latest)
      # ══════════════════════════════════════════════════════════════════════════
      - job: PowerFxRun
        displayName: "pac power-fx run"
        timeoutInMinutes: 30
        pool:
          name: "Azure Pipelines"
          vmImage: "ubuntu-latest"

        steps:
          - checkout: self

          # Download Microsoft.PowerApps.CLI.Tool from NuGet (tool entry point package)
          - bash: |
              PAC_DIR="$AGENT_TOOLSDIRECTORY/pac"
              mkdir -p "$PAC_DIR/bin"
              VERSION=$(curl -fsSL "https://api.nuget.org/v3-flatcontainer/microsoft.powerapps.cli.tool/index.json" \
                | python3 -c "import sys,json; print(json.load(sys.stdin)['versions'][-1])")
              echo "Downloading Microsoft.PowerApps.CLI.Tool v$VERSION"
              curl -fsSL "https://api.nuget.org/v3-flatcontainer/microsoft.powerapps.cli.tool/$VERSION/microsoft.powerapps.cli.tool.$VERSION.nupkg" \
                -o "$PAC_DIR/pac-tool.zip"
              unzip -q "$PAC_DIR/pac-tool.zip" -d "$PAC_DIR/pkg"

              # No Linux shim exists in the package — find pac.dll and wrap with dotnet
              PAC_DLL=$(find "$PAC_DIR/pkg" -name "pac.dll" -type f 2>/dev/null | head -1)
              if [ -n "$PAC_DLL" ]; then
                printf '#!/bin/bash\nexec dotnet "%s" "$@"\n' "$PAC_DLL" > "$PAC_DIR/bin/pac"
                chmod +x "$PAC_DIR/bin/pac"
                echo "##vso[task.prependpath]$PAC_DIR/bin"
                "$PAC_DIR/bin/pac" --version
              else
                # Diagnostic: show root-level DLLs (skip locale subdirs) to find entry point
                echo "##[error]pac.dll not found. Root DLLs in package:"
                find "$PAC_DIR/pkg" -name "*.dll" -not -path "*/*-*/*" -not -path "*/shims/*" | sort
                exit 1
              fi
            displayName: "Install pac CLI from NuGet"

          - bash: |
              pac auth create \
                --environment "$(POWER_APPS_ENVIRONMENT_URL)" \
                --username "$(user1Email)" \
                --password "$(user1Password)"
            displayName: "pac auth create"
            env:
              user1Password: $(user1Password)

          - bash: |
              pac power-fx run \
                --file "$(testPlanFile)" \
                --environment "$(POWER_APPS_ENVIRONMENT_URL)"
            displayName: "pac power-fx run — TC1_PJC_001.fx.yaml"
            workingDirectory: $(Build.SourcesDirectory)
            env:
              user1Email: $(user1Email)
              user1Password: $(user1Password)

      # ══════════════════════════════════════════════════════════════════════════
      # Job 2 — pac test run --provider Canvas (windows-latest)
      # ══════════════════════════════════════════════════════════════════════════
      - job: CanvasTestRun
        displayName: "pac test run --provider Canvas"
        timeoutInMinutes: 60
        pool:
          name: "Azure Pipelines"
          vmImage: "windows-latest"

        steps:
          - checkout: self

          # Download Microsoft.PowerApps.CLI.Tool from NuGet (tool entry point package)
          - pwsh: |
              $pacDir = "$env:AGENT_TOOLSDIRECTORY\pac"
              $binDir = "$pacDir\bin"
              New-Item -ItemType Directory -Path $pacDir -Force | Out-Null
              New-Item -ItemType Directory -Path $binDir -Force | Out-Null
              $idx = Invoke-RestMethod "https://api.nuget.org/v3-flatcontainer/microsoft.powerapps.cli.tool/index.json" -UseBasicParsing
              $version = $idx.versions[-1]
              Write-Host "Downloading Microsoft.PowerApps.CLI.Tool v$version"
              $url = "https://api.nuget.org/v3-flatcontainer/microsoft.powerapps.cli.tool/$version/microsoft.powerapps.cli.tool.$version.nupkg"
              Invoke-WebRequest $url -OutFile "$pacDir\pac-tool.zip" -UseBasicParsing
              Expand-Archive "$pacDir\pac-tool.zip" -DestinationPath "$pacDir\pkg" -Force

              # Skip the shim (it needs a .store/ relative path that doesn't exist
              # when extracted manually). Find pac.dll and wrap with dotnet instead.
              $pacDll = Get-ChildItem "$pacDir\pkg" -Filter "pac.dll" -Recurse |
                        Select-Object -First 1
              if ($pacDll) {
                Write-Host "Found pac.dll at: $($pacDll.FullName)"
                "@echo off`r`ndotnet `"$($pacDll.FullName)`" %*" |
                  Set-Content -Path "$binDir\pac.cmd" -Encoding ASCII
                Write-Host "##vso[task.prependpath]$binDir"
                & dotnet $pacDll.FullName --version
              } else {
                Write-Error "pac.dll not found. Root-level DLLs in package:"
                Get-ChildItem "$pacDir\pkg" -Filter "*.dll" -Recurse |
                  Where-Object { $_.FullName -notmatch '\\[a-z]{2}(-[A-Za-z]{2,4})?\\' } |
                  Select-Object FullName | Sort-Object FullName
                exit 1
              }
            displayName: "Install pac CLI from NuGet"

          - task: UseDotNet@2
            displayName: "Use .NET 8"
            inputs:
              packageType: sdk
              version: "8.x"

          - task: NodeTool@0
            displayName: "Use Node.js 20.x"
            inputs:
              versionSpec: "20.x"

          # PATE uses Chromium internally — --with-deps is Linux-only, omit on Windows
          - pwsh: npx playwright install chromium
            displayName: "Pre-install Chromium for PATE"
            failOnStderr: false
            timeoutInMinutes: 15

          - pwsh: |
              pac auth create `
                --environment "$(POWER_APPS_ENVIRONMENT_URL)" `
                --username "$(user1Email)" `
                --password "$(user1Password)"
            displayName: "pac auth create"
            env:
              user1Password: $(user1Password)

          # pac v2.6.4+: --output-directory is ignored; results always go to
          # $env:USERPROFILE\Microsoft\TestEngine\TestOutput\<timestamp>\
          - pwsh: |
              pac test run `
                --test-plan-file "$(testPlanFile)" `
                --environment-id "$(POWER_APPS_ENVIRONMENT_ID)" `
                --tenant "$(AZURE_TENANT_ID)" `
                --provider Canvas `
                --user-auth Storagestate `
                --log-level Information
            displayName: "pac test run — TC1_PJC_001.fx.yaml"
            workingDirectory: $(Build.SourcesDirectory)
            env:
              user1Email: $(user1Email)
              user1Password: $(user1Password)

          - task: PublishTestResults@2
            displayName: "Publish JUnit test results"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "**/*.xml"
              searchFolder: "$(USERPROFILE)\\Microsoft\\TestEngine\\TestOutput"
              testRunTitle: "Canvas — TC1_PJC_001"
              failTaskOnFailedTests: true
              mergeTestResults: true

          - task: PublishPipelineArtifact@1
            displayName: "Publish test artifacts (video / screenshots)"
            condition: succeededOrFailed()
            inputs:
              targetPath: "$(USERPROFILE)\\Microsoft\\TestEngine\\TestOutput"
              artifact: Canvas-Artifacts-TC1_PJC_001
